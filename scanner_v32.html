<script>
'use strict';

/* ============================ ثوابت ============================ */
const BASE = 'https://api.binance.com/api/v3';
const STABLE_BASES = new Set(['USDC','TUSD','FDUSD','DAI','USDP','PYUSD','USDD','GUSD','EURI','USTC','SUSD','LUSD','USDE','BUSD','EUR','USD1']);

/* v25 — الحدّ اليومي صار ثابتًا. في v24 كان boundaryHour() = ساعة الضغط على الزر،
   فنفس العملة تُصنَّف "عرضي" صباحًا و"مختلط" مساءً بلا أي حركة سوق. */
const DAY_BOUNDARY_HOUR = 18;

const MIN_IDX  = 240;
const MIN_BARS = 260;

/* أفق الانتظار وسياسة القصّ (بشموع 4h) */
const HORIZON_BARS = 120;   // 20 يومًا — أقصى انتظار قبل اعتبارها "متعلّقة"
const CUT_BARS     = 18;    // 3 أيام — سياسة القصّ البديلة للمقارنة
const BARS_PER_DAY = 6;

/* شبكة البحث: المدة × الهدف الصافي */
const TWAP_DURS    = [1,2,3,6,9,12];                       // 4..48 ساعة
const TWAP_TARGETS = [0.008,0.012,0.018,0.025,0.035,0.05]; // صافي بعد الرسوم
/* v29: كانت خطوة DCA وهدفه مثبّتين على 1% لكل العملات — نفس الخطأ الذي
   أُصلح للتواب في v25 وبقي هنا. الآن يُختاران لكل عملة بملاءمة أمامية. */
/* ---- الأمر المحدّد: اشترِ عند سعر، بِع عند سعر. بلا بوت. ---- */
const LIMIT_DIPS    = [0.003,0.006,0.010,0.015,0.025]; // كم تحت السعر المرجعي يوضع أمر الشراء
const LIMIT_TARGETS = [0.008,0.012,0.018,0.025,0.035,0.05];
const FILL_BARS     = 12;   // 48 ساعة لينفّذ أمر الشراء، وإلا يُلغى

/* بوابات القبول */
const MIN_EFF_N   = 6;      // أقل عدد صفقات متتالية فعلية في نافذة الاختبار
const MAX_STUCK   = 15;     // % الصفقات المتعلّقة فوق الأفق
const MAX_DD      = 8;      // % أسوأ تراجع (المئين 90)
/* v26: v25 كانت تقبل أي عائد > 0، فكانت تعرض +0.02%/يوم ككرت أخضر "آمن".
   0.02%/يوم = 0.6% بالشهر — ضجيج، ومخاطرة مقابل لا شيء. */
const MIN_RET_DAY = 0.10;   // % لكل يوم — أقل عائد يستحق فتح صفقة أصلًا
const GOOD_RET_DAY= 0.25;   // % لكل يوم — فوقه يستحق حجمًا عاديًا
const SHRINK_K    = 8;      // معامل تقليص العائد نحو الصفر عند العينة الصغيرة

const REGIME_MIN        = 60;
const REGIME_MIN_SAMPLE = 20;
const RISKY_STATES = new Set(['TRENDING_DOWN','DIRTY_RANGE']);
const MANIA_RATIO = 2.5;

const TRAIN_FRAC = 0.70;    // ملاءمة أمامية: يتدرّب على 70% ويُعرض من الـ30% الباقية

/* ============ الرسوم: مصدر واحد للحقيقة ============
   v24 كتبت نفس الرقم 3 مرات بـ3 وحدات (1.012 مضاعِف · 0.2 نسبة · 0.002 كسر).
   هنا رقم واحد من الواجهة، وكل شيء مشتق منه. */
/* v26: أُزيل حقل الرسوم من الواجهة — رسومك ثابتة (بينانس 0.1% مع خصم BNB 25%).
   لو تغيّر خصم BNB أو صعدت VIP، عدّل هذا الرقم وحده وكل الحسابات تتبعه. */
const FEE_ONE_WAY = 0.00075;                      // 0.075% للاتجاه الواحد
const feeRound  = () => FEE_ONE_WAY * 2;          // 0.15% ذهاب وإياب
const feeMult   = () => (1+FEE_ONE_WAY)/(1-FEE_ONE_WAY);

/* ============================ مؤشرات ============================ */
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function pctOf(arr,q){ if(!arr.length) return null;
  const s=arr.slice().sort((x,y)=>x-y); return s[Math.min(s.length-1, Math.floor(s.length*q))]; }
const fin = v => typeof v === 'number' && isFinite(v);
/* شمعة سليمة: كل الأسعار موجبة ومنتهية. شمعة تالفة واحدة من الـAPI كانت
   تكفي لتحويل كل الحسابات إلى NaN — وNaN يمرّ من أي بوابة (NaN <= 0 خطأ). */
const saneOHLC = c => fin(c.h) && fin(c.l) && fin(c.c) && c.h>0 && c.l>0 && c.c>0 && c.h>=c.l;

function ema(values, period){
  const out = new Array(values.length).fill(null);
  if(values.length < period) return out;
  let sum = 0;
  for(let i=0;i<period;i++) sum += values[i];
  out[period-1] = sum/period;
  const k = 2/(period+1);
  for(let i=period;i<values.length;i++) out[i] = values[i]*k + out[i-1]*(1-k);
  return out;
}
function rsi(closes, period=14){
  const out = new Array(closes.length).fill(null);
  if(closes.length <= period) return out;
  let gains=0, losses=0;
  for(let i=1;i<=period;i++){ const d=closes[i]-closes[i-1]; if(d>=0) gains+=d; else losses-=d; }
  let avgGain=gains/period, avgLoss=losses/period;
  out[period] = 100-(100/(1+(avgLoss===0?100:avgGain/avgLoss)));
  for(let i=period+1;i<closes.length;i++){
    const d=closes[i]-closes[i-1], g=d>0?d:0, l=d<0?-d:0;
    avgGain=(avgGain*(period-1)+g)/period; avgLoss=(avgLoss*(period-1)+l)/period;
    out[i]=100-(100/(1+(avgLoss===0?100:avgGain/avgLoss)));
  }
  return out;
}
function atr(highs, lows, closes, period=10){
  const tr=[highs[0]-lows[0]];
  for(let i=1;i<closes.length;i++) tr.push(Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1])));
  const out = new Array(tr.length).fill(null);
  if(tr.length < period) return out;
  let s=0; for(let i=0;i<period;i++) s+=tr[i];
  out[period-1]=s/period;
  for(let i=period;i<tr.length;i++) out[i] = (out[i-1]*(period-1)+tr[i])/period;
  return out;
}
function supertrend(highs, lows, closes, period=10, mult=3){
  const a = atr(highs, lows, closes, period);
  const n = closes.length;
  const dir = new Array(n).fill(null), st = new Array(n).fill(null);
  let fUp=null, fLo=null, prevDir=1;
  for(let i=0;i<n;i++){
    if(a[i]==null) continue;
    const hl2=(highs[i]+lows[i])/2;
    let up = hl2 + mult*a[i], lo = hl2 - mult*a[i];
    if(fUp!=null){
      up = (up < fUp || closes[i-1] > fUp) ? up : fUp;
      lo = (lo > fLo || closes[i-1] < fLo) ? lo : fLo;
      prevDir = (prevDir===1 && closes[i] < fLo) ? -1 : (prevDir===-1 && closes[i] > fUp) ? 1 : prevDir;
    } else prevDir = closes[i] > lo ? 1 : -1;
    dir[i]=prevDir; st[i]= prevDir===1 ? lo : up;
    fUp=up; fLo=lo;
  }
  return { dir, st };
}
function adx(highs, lows, closes, period=14){
  const len = closes.length;
  const out = new Array(len).fill(null);
  if(len < period*3) return out;
  const tr=[0], pdm=[0], mdm=[0];
  for(let i=1;i<len;i++){
    const up = highs[i]-highs[i-1], dn = lows[i-1]-lows[i];
    pdm.push(up>dn && up>0 ? up : 0);
    mdm.push(dn>up && dn>0 ? dn : 0);
    tr.push(Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1])));
  }
  const smooth = arr => {
    const o = new Array(len).fill(null);
    let s = arr.slice(1,period+1).reduce((a,b)=>a+b,0);
    o[period]=s;
    for(let i=period+1;i<len;i++){ s = s - (s/period) + arr[i]; o[i]=s; }
    return o;
  };
  const trS=smooth(tr), pS=smooth(pdm), mS=smooth(mdm);
  const dx=new Array(len).fill(null);
  for(let i=period;i<len;i++){
    if(!trS[i]) continue;
    const pdi=100*(pS[i]/trS[i]), mdi=100*(mS[i]/trS[i]);
    dx[i] = 100*Math.abs(pdi-mdi)/((pdi+mdi) || 1);
  }
  const seed = dx.slice(period, period*2).filter(v=>v!=null);
  if(seed.length < period) return out;
  out[period*2-1] = seed.reduce((a,b)=>a+b,0)/seed.length;
  for(let i=period*2;i<len;i++){
    if(dx[i]==null || out[i-1]==null) continue;
    out[i] = (out[i-1]*(period-1)+dx[i])/period;
  }
  return out;
}


/* ============================================================
   كل نداء شبكة يمرّ من هنا. v30 كانت تستعمل fetch مباشرة بلا مهلة —
   نداء واحد يعلّق على شبكة الجوال كان يوقف المسح للأبد ويترك الزر معطّلًا.
   ============================================================ */
const NET_TIMEOUT = 15000;
async function fetchJSON(url, tries=2){
  for(let a=0; a<tries; a++){
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), NET_TIMEOUT);
    try{
      const res = await fetch(url, {signal: ctl.signal});
      clearTimeout(timer);
      if(res.status === 429 || res.status === 418){    // تجاوز الحد — تمهّل ثم أعد
        await new Promise(r=>setTimeout(r, 2000*(a+1)));
        continue;
      }
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    }catch(e){
      clearTimeout(timer);
      if(a === tries-1) throw e;
      await new Promise(r=>setTimeout(r, 600));
    }
  }
  throw new Error('فشل الاتصال');
}

/* ============================ جلب البيانات ============================ */
/* v25: تصفّح للخلف لجلب تاريخ أطول — الملاءمة الأمامية بلا بيانات كافية بلا معنى. */
async function fetchKlines(symbol, interval, wanted){
  let all = [], endTime = null;
  while(all.length < wanted){
    const lim = Math.min(1000, wanted - all.length);
    let url = `${BASE}/klines?symbol=${symbol}&interval=${interval}&limit=${lim}`;
    if(endTime) url += `&endTime=${endTime}`;
    const chunk = await fetchJSON(url);
    if(!Array.isArray(chunk) || !chunk.length) break;
    all = chunk.concat(all);
    endTime = chunk[0][0] - 1;
    if(chunk.length < lim) break;
  }
  return all;
}

/* ============================ حارس BTC ============================ */
async function checkBTCGuard(){
  const banner = document.getElementById('btcBanner');
  try{
    const [hRaw, dRaw] = await Promise.all([
      fetchJSON(`${BASE}/klines?symbol=BTCUSDT&interval=1h&limit=27`),
      fetchJSON(`${BASE}/klines?symbol=BTCUSDT&interval=1d&limit=6`)
    ]);
    const kl = hRaw.slice(0,-1);
    const dKl = dRaw.slice(0,-1);
    if(!Array.isArray(kl) || kl.length < 25) throw new Error('بيانات BTC غير كافية');
    const closes = kl.map(k=>parseFloat(k[4]));
    const now = closes.at(-1);
    const chg1h  = ((now - closes.at(-2))/closes.at(-2))*100;
    const chg4h  = ((now - closes.at(-5))/closes.at(-5))*100;
    const chg24h = ((now - closes.at(-25))/closes.at(-25))*100;

    const dC = dKl.map(k=>parseFloat(k[4]));
    const absCh = [];
    for(let i=1;i<dC.length;i++) absCh.push(Math.abs((dC[i]/dC[i-1]-1)*100));
    const l3 = absCh.slice(-3);
    const calming = l3.length===3 && l3.at(-1) < l3[0] && l3.at(-1) < 2.5;

    let level='safe', title='BTC مستقر — التداول مفتوح', halt=0;
    if(chg24h <= -10){ level='halt'; title='إيقاف طارئ — انهيار BTC خلال 24 ساعة'; halt=3; }
    else if(chg4h <= -7){ level='halt'; title='إيقاف الدخول الجديد — هبوط حاد خلال 4 ساعات'; halt=2; }
    else if(chg1h <= -5){ level='warn'; title='تحذير — هبوط سريع خلال ساعة، لا دخول جديد'; halt=1; }

    /* v27: بلا نسب — سطر واحد يقول اشتغل أو لا تشتغل */
    const plain = ['السوق مستقر — اشتغل عادي',
                   'انتظر — السوق نزل بسرعة، لا تفتح صفقة جديدة',
                   'لا تفتح شي — بيتكوين هابط بقوة',
                   'لا تفتح شي — بيتكوين ينهار'][halt];
    banner.className = 'btc-banner ' + level;
    banner.innerHTML = `<div><div class="title">${plain}</div></div>`;
    return halt;
  } catch(e){
    banner.className = 'btc-banner warn';
    banner.innerHTML = `<div><div class="title">تعذّر فحص السوق — لا تفتح شي، أعد المسح</div></div>`;
    return 1;
  }
}


/* ============================================================
   مواصفات كل عملة من بينانس (خطوة السعر + أقل قيمة أمر).
   بدونها كنا نعطي سعرًا بـ7 خانات لعملة تقبل 6، فيرفضه بينانس
   برسالة غامضة، أو نطاق شبكة بمبلغ أقل من حدّه الأدنى فلا يعمل.
   ============================================================ */
const SPECS = {};
async function loadSpecs(symbols){
  if(!symbols.length) return;
  try{
    const q = encodeURIComponent(JSON.stringify(symbols));
    const d = await fetchJSON(`${BASE}/exchangeInfo?symbols=${q}`);
    for(const sy of (d.symbols||[])){
      let tick = null, minNotional = null;
      for(const f of (sy.filters||[])){
        if(f.filterType === 'PRICE_FILTER') tick = parseFloat(f.tickSize);
        if(f.filterType === 'NOTIONAL' || f.filterType === 'MIN_NOTIONAL')
          minNotional = parseFloat(f.minNotional ?? f.notional);
      }
      SPECS[sy.symbol] = { tick: fin(tick)&&tick>0 ? tick : null,
                           minNotional: fin(minNotional)&&minNotional>0 ? minNotional : 5 };
    }
  }catch(e){ /* نكمل بلا تدوير — أفضل من إيقاف المسح */ }
}
function rndPx(r, px){
  if(!fin(px)) return '—';
  const sp = SPECS[r.symbol];
  if(sp && sp.tick){
    const dec = Math.max(0, Math.round(-Math.log10(sp.tick)));
    const snapped = Math.round(px/sp.tick)*sp.tick;
    return snapped.toLocaleString('en-US',{minimumFractionDigits:dec, maximumFractionDigits:dec});
  }
  return fmtMoney(px);
}
function minGridUSD(r, N){
  const mn = (SPECS[r.symbol] && SPECS[r.symbol].minNotional) || 5;
  return Math.ceil(mn * N / 10) * 10;
}

/* ==================== أدوات جودة النطاق ==================== */
function lowerLowsCheck(lows){
  const recent = lows.slice(-5), prior = lows.slice(-10,-5);
  if(prior.length < 5) return false;
  return Math.min(...recent) < Math.min(...prior) * 0.995;
}
function volumeDirectionDirty(closes, volumes){
  const n = closes.length;
  if(n < 21) return false;
  let downVol=0, downN=0, upVol=0, upN=0;
  for(let i=n-20;i<n;i++){
    if(closes[i]-closes[i-1] < 0){ downVol+=volumes[i]; downN++; } else { upVol+=volumes[i]; upN++; }
  }
  const aDown = downN? downVol/downN : 0, aUp = upN? upVol/upN : 0;
  return aDown > aUp*1.15;
}


/* ============================================================
   فلاتر الخطر — تُطبَّق قبل أي حساب ربح.
   الهدف: استبعاد ما قد يخسره 20% دفعة واحدة، مهما بدت أرقامه جميلة.
   ============================================================ */
function dangerFlags(dC){
  const out = { crashDay:null, pumpDump:false };
  // أسوأ هبوط في يوم واحد خلال آخر 90 يومًا
  const w = dC.slice(-91);
  let worst = 0;
  for(let i=1;i<w.length;i++){
    const d = (w[i]/w[i-1] - 1)*100;
    if(d < worst) worst = d;
  }
  out.crashDay = +worst.toFixed(1);
  // نمط بمب ودمب: صعود ≥100% خلال 30 يومًا ثم هبوط ≥50% خلال 60 يومًا بعده
  const h = dC.slice(-240);
  for(let i=0;i+90<h.length;i++){
    const start = h[i];
    let peak = start, peakIdx = i;
    for(let j=i;j<Math.min(i+30,h.length);j++) if(h[j]>peak){ peak=h[j]; peakIdx=j; }
    if(peak < start*2) continue;
    let trough = peak;
    for(let j=peakIdx;j<Math.min(peakIdx+60,h.length);j++) if(h[j]<trough) trough=h[j];
    if(trough <= peak*0.5){ out.pumpDump = true; break; }
  }
  return out;
}
const MIN_MOVE_PCT = 0.8;      // % — أقل حركة يومية تستحق التحليل (يُسقط العملات المستقرة)
const CRASH_DAY_LIMIT = -20;   // % — يوم واحد بهذا الحجم يكفي لاستبعاد العملة

/* ==================== التصنيف اليومي ==================== */
function classifyAtIndex(idx, closes, highs, lows, vols, e50, e200, adxArr, stDir){
  if(idx < MIN_IDX) return null;
  if(e50[idx]==null || e200[idx]==null || e200[idx-20]==null || adxArr[idx]==null) return null;
  const lastAdx = adxArr[idx];
  const dir = stDir ? stDir[idx] : null;
  const slope = ((e200[idx] - e200[idx-20]) / e200[idx-20]) * 100;
  const prev5 = (idx-5>=0 && adxArr[idx-5]!=null) ? adxArr[idx-5] : lastAdx;
  const adxChange = lastAdx - prev5;
  const hi10 = Math.max(...highs.slice(idx-9, idx+1));
  const lo10 = Math.min(...lows.slice(idx-9, idx+1));
  const range10Pct = ((hi10-lo10)/closes[idx])*100;

  let state, subLabel='';
  const trendUp   = e50[idx]>e200[idx] && lastAdx>25 && slope>0.3 && dir===1;
  const trendDown = e50[idx]<e200[idx] && lastAdx>25 && dir===-1;

  if(trendUp) state='TRENDING_UP';
  else if(trendDown){ state='TRENDING_DOWN'; subLabel = adxChange<-3?' (يضعف)':(adxChange>3?' (يتقوى)':''); }
  else if(lastAdx < 20){
    const flags = [
      lowerLowsCheck(lows.slice(idx-14, idx+1)),
      Math.abs(slope)>1.5 && slope<0,
      volumeDirectionDirty(closes.slice(0,idx+1), vols.slice(0,idx+1)),
      range10Pct >= 15
    ].filter(Boolean).length;
    state = flags>=2 ? 'DIRTY_RANGE' : 'CLEAN_RANGE';
  } else state='MIXED';

  return {state, subLabel, adx:lastAdx, adxChange, ema200Slope:slope, range10Pct, stDir:dir};
}
function stateLabel(s){
  return {TRENDING_UP:'صاعد', TRENDING_DOWN:'هابط',
    CLEAN_RANGE:'عرضي نظيف', DIRTY_RANGE:'عرضي غير نظيف', MIXED:'مختلط'}[s] || '—';
}
function computeDayStates(closes, highs, lows, vols, e50, e200, adxArr, stDir, closeTimes){
  const out = new Array(closes.length);
  for(let i=0;i<closes.length;i++){
    const c = i>=MIN_IDX ? classifyAtIndex(i, closes, highs, lows, vols, e50, e200, adxArr, stDir) : null;
    out[i] = { closeTime: closeTimes[i], state: c ? c.state : null };
  }
  return out;
}

/* ==================== نصوص ==================== */
function durTxt(totalH){
  totalH = Math.round(totalH);
  const hU = h => h===1?'ساعة واحدة':h===2?'ساعتين':(h>=3&&h<=10)?(h+' ساعات'):(h+' ساعة');
  const dU = d => d===1?'يوم':d===2?'يومين':(d>=3&&d<=10)?(d+' أيام'):(d+' يوم');
  if(totalH <= 24) return hU(totalH);
  const d = Math.floor(totalH/24), rem = totalH%24;
  return rem===0 ? dU(d) : dU(d)+' و'+hU(rem);
}
const fmtPx = p => {
  if(p==null || !isFinite(p)) return '—';
  const a = Math.abs(p);
  return a>=100 ? p.toFixed(2) : a>=1 ? p.toFixed(4) : a>=0.01 ? p.toFixed(5)
       : a>=0.0001 ? p.toFixed(7) : p.toPrecision(4);
};
const sgn = v => (v>=0?'+':'') + v.toFixed(2) + '%';
/* v27: سعر بفواصل آلاف — 59,077 أسهل بالقراءة والنسخ من 59077.26 */
function fmtMoney(p){
  if(!fin(p)) return '—';
  const a=Math.abs(p);
  const dec = a>=1000 ? 0 : a>=100 ? 2 : a>=1 ? 4 : a>=0.01 ? 5 : 7;
  return p.toLocaleString('en-US',{minimumFractionDigits: a>=1?dec:0, maximumFractionDigits:dec});
}
/* v30: أُزيلت كل الحقول. الماسح يقرّر بنفسه — الحقول كانت تعطي إحساس تحكّم
   بلا أثر (حقل السيولة تحديدًا لم يكن يغيّر أي عملة لأن الترتيب بالحجم يسبقه). */
const PRESCREEN_N = 100;   // كم عملة تُفحص فحصًا سريعًا
const DEEP_N      = 25;    // كم عملة تُحلَّل بعمق
const nTawsia = n => n===1?'توصية واحدة':n===2?'توصيتين':(n>=3&&n<=10)?`${n} توصيات`:`${n} توصية`;
const cls3 = (v,g,b) => v>=g ? 'good' : (v<=b ? 'bad' : 'mid');

/* ==================== احتمال ارتداد الحالة ==================== */
function regimePersistence(dayStates, currentState){
  let total=0, rebounded=0;
  for(let k=0;k<dayStates.length-1;k++){
    if(dayStates[k].state !== currentState) continue;
    const nx = dayStates[k+1].state;
    if(!nx) continue;
    total++;
    if(!RISKY_STATES.has(nx)) rebounded++;
  }
  if(total < REGIME_MIN_SAMPLE) return { prob:null, sample: total };
  return { prob: Math.round(rebounded/total*100), sample: total };
}

/* ============================================================
   محرّك التواب v25 — توزيع عائد بدل نسبة نجاح
   ------------------------------------------------------------
   v24 سألت: "كم مرة تلمس +1%؟" ثم عملت break — فرمَت كل معلومة
   عن حجم الحركة ومدة الاحتجاز.
   v25 تسأل: "كم تربح لكل يوم رأس مال معطّل؟" وتختار الهدف
   المناسب لكل عملة بدل رقم ثابت مفروض.
   ============================================================ */

/* إعادة تشغيل متتالية — لا نوافذ متداخلة.
   صفقة تبدأ حيث انتهت السابقة، تمامًا كما ستتداول فعلًا.
   هذا يحلّ مشكلتين معًا: يلغي تضخيم حجم العينة بالتداخل، ويجعل المقياس
   (عائد لكل يوم تقويمي على رأس مال محجوز) قابلًا للمقارنة مع الشبكة وDCA
   — التي تحجز رأس مالك طوال الفترة سواء تداولت أم لا. */
function twapReplay(bars, from, to, D, T, fm, maxHold){
  let i = from, retSum = 0, trades = 0, hits = 0, stuck = 0, holdBars = 0;
  const dds = [], waits = [];
  while(i + D < to - 1){
    let sum = 0;
    for(let m=0;m<D;m++) sum += bars[i+m].typ;
    const avg = sum/D;
    if(!(avg > 0)){ i += D; continue; }

    let worst = 0;
    for(let m=0;m<D;m++) worst = Math.max(worst, (avg-bars[i+m].low)/avg*100);
    const sell = avg*(1+T)*fm;
    const last = Math.min(i+D+maxHold, to-1);

    let hit = -1;
    for(let j=i+D; j<=last; j++){
      if(bars[j].low < avg) worst = Math.max(worst, (avg-bars[j].low)/avg*100);
      if(bars[j].high >= sell){ hit = j; break; }
    }
    let exit, ret;
    if(hit >= 0){ exit = hit; ret = T*100; hits++; waits.push((exit-i+1)*4); }
    else { exit = last; ret = ((bars[last].close/avg)/fm - 1)*100; stuck++; }

    retSum += ret; holdBars += (exit-i+1); dds.push(worst); trades++;
    i = exit + 1;
  }
  const windowDays = (to-from)/BARS_PER_DAY;
  return {
    durH: D*4, target: T*100,
    retPerDay: windowDays>0 ? retSum/windowDays : 0,
    trades, hits, stuck,
    reach: trades ? Math.round(hits/trades*100) : 0,
    stuckPct: trades ? +(stuck/trades*100).toFixed(1) : 0,
    medWaitH: pctOf(waits,0.5),
    ddP90: pctOf(dds,0.9) || 0,
    util: Math.round(holdBars/Math.max(1,(to-from))*100)
  };
}

function optimizeTwap(bars){
  const bars4h = bars.filter(b => fin(b.high) && fin(b.low) && fin(b.close) && fin(b.typ) && b.low > 0);
  const n = bars4h.length;
  if(n < 800) return null;
  const split = Math.floor(n * TRAIN_FRAC);
  const fm = feeMult();

  // 1) اختيار (المدة × الهدف) على قسم التدريب فقط
  let pick = null;
  for(const D of TWAP_DURS){
    for(const T of TWAP_TARGETS){
      const row = twapReplay(bars4h, 0, split, D, T, fm, HORIZON_BARS);
      if(row.trades < MIN_EFF_N*2) continue;      // التدريب أوسع فنطلب عينة أكبر
      if(!pick || row.retPerDay > pick.retPerDay) pick = row;
    }
  }
  if(!pick) return null;

  // 2) القياس المعروض من قسم لم يره المحرّك إطلاقًا
  const D = pick.durH/4, T = pick.target/100;
  const test    = twapReplay(bars4h, split, n, D, T, fm, HORIZON_BARS);
  const testCut = twapReplay(bars4h, split, n, D, T, fm, Math.max(1, CUT_BARS-D));
  test.cutRetPerDay = testCut.retPerDay;
  test.effN = test.trades;

  return { train: pick, test,
           testDays: Math.round(((n-split)*4)/24),
           trainDays: Math.round((split*4)/24) };
}

function evaluateTwap(r){
  const o = r.twap;
  const none = {ok:false, retPerDay:null, main:[], detail:[], steps:[], stops:[], why:[], rec:null};
  if(!o) return {...none, cls:'bl-no', head:'⚪ ما بقدر أحكم — العملة جديدة',
    why:['هذه العملة أحدث من أن تُقسم لتدريب واختبار. لا يمكن قياسها بأمانة.']};

  const t = o.test;
  if(t.effN < MIN_EFF_N) return {...none, cls:'bl-no', head:'⚪ ما بقدر أحكم — بياناتها قليلة',
    why:[`قسم الاختبار يسمح بـ${t.effN} صفقة متتالية فقط — أقل من ${MIN_EFF_N}. أي رقم هنا حظ.`]};

  if(!fin(t.retPerDay) || t.retPerDay < MIN_RET_DAY) return {...none, cls:'bl-no',
    head: '🔴 لا تفتح جديد — ربحها ما يستاهل',
    why:[`أفضل إعداد (${durTxt(t.durH)} · هدف ${t.target.toFixed(1)}%) أعطى ${sgn(t.retPerDay)}/يوم — حدّك ${MIN_RET_DAY}%.`,
         `على قسم التدريب كان ${sgn(o.train.retPerDay)}/يوم — الفرق بينهما هو ما كانت v24 تعرضه كربح.`]};

  if(t.stuckPct > MAX_STUCK) return {...none, cls:'bl-no', head:'🔴 لا تفتح جديد — بتحبس مالك طويل',
    why:[`${t.stuckPct}% من الصفقات لم تصل الهدف خلال ${HORIZON_BARS/BARS_PER_DAY} يومًا — أعلى من حدّك ${MAX_STUCK}%.`,
         `العائد قد يبدو جيدًا، لكن رأس مالك يُقفل ويفوّت عليك فرصًا لا يقيسها أي رقم.`]};

  if(t.ddP90 > MAX_DD) return {...none, cls:'bl-no', head:'🔴 لا تفتح جديد — بتنزل كثير قبل ترجع',
    why:[`السعر ينزل ${t.ddP90.toFixed(1)}% تحت متوسطك في أسوأ 10% — أوسع من حدّك ${MAX_DD}%.`]};

  const shrunk = t.retPerDay * (t.effN/(t.effN+SHRINK_K));
  if(shrunk < MIN_RET_DAY) return {...none, cls:'bl-no', head:'🔴 لا تفتح جديد — ربحها ما يستاهل',
    why:[`العائد الخام ${sgn(t.retPerDay)}/يوم من ${t.trades} صفقة فقط. بعد التقليص بحجم العينة يصير ${sgn(shrunk)} — تحت حدّك ${MIN_RET_DAY}%.`]};
  const strong = shrunk >= GOOD_RET_DAY && t.ddP90 <= 4 && t.stuckPct <= 6;
  const better = t.cutRetPerDay > t.retPerDay;

  return {
    ok:true, retPerDay: shrunk, rawRet: t.retPerDay, dd: t.ddP90, durH: t.durH,
    cls: strong ? 'bl-go' : 'bl-exp',
    head: '🟢 اعمل تواب',
    main: [
      ['المدة', durTxt(t.durH)],
      ['بيع عند', `+${t.target.toFixed(1)}% فوق متوسطك`, 'good'],
      ['تقديريًا', fin(r.livePrice) ? rndPx(r, r.livePrice*(1+t.target/100)*feeMult()) : '—']
    ],
    detail: [
      ['💰 المتوقع', [
        [`وصول خلال ${HORIZON_BARS/BARS_PER_DAY} يوم`, `${t.reach}%`],
        ['وسيط الانتظار', t.medWaitH!=null ? durTxt(t.medWaitH) : '—'],
        ['رأس مالك مشغول', `${t.util}% من الوقت`]
      ]],
      ['⚠️ لو ما وصلت', [
        [`تعلّق فوق ${HORIZON_BARS/BARS_PER_DAY} يوم`, `${t.stuckPct}%`, cls3(-t.stuckPct,-6,-MAX_STUCK)],
        ['أسوأ تراجع', `−${t.ddP90.toFixed(1)}%`, cls3(-t.ddP90,-4,-MAX_DD)],
        ['لو قصّيتها بـ3 أيام', `${sgn(t.cutRetPerDay)}/يوم`, better?'good':'']
      ]]
    ],
    why: [
      better
        ? `القصّ بعد 3 أيام أفضل هنا (${sgn(t.cutRetPerDay)} مقابل ${sgn(t.retPerDay)}/يوم) — لا تنتظرها طويلًا.`
        : `الانتظار الكامل أفضل من القصّ (${sgn(t.retPerDay)} مقابل ${sgn(t.cutRetPerDay)}/يوم) — لا تستعجل الخروج.`,
      `الهدف ${t.target.toFixed(1)}% مُختار لهذه العملة تحديدًا من ${TWAP_TARGETS.length} مستويات — ليس رقمًا ثابتًا مفروضًا.`,
      `${t.trades} صفقة فعلية متتالية خلال ${o.testDays} يومًا (كل واحدة تبدأ حيث انتهت السابقة). العائد المعروض مُقلَّص نحو الصفر بحجم هذه العينة.`
    ],
    oos: `🔒 مقيس على ${o.testDays} يومًا لم يرها المحرّك · اختار الإعداد من ${o.trainDays} يومًا قبلها`,
    rec: {type:'twap', sym:r.symbol, price:(r.livePrice??r.price), durH:t.durH, target:+t.target.toFixed(1)}
  };
}


/* ============================================================
   الأمر المحدّد — أبسط ما يكون: أمر شراء عند سعر، أمر بيع عند سعر.
   لا بوت ولا مدة ولا متابعة. عيبه الوحيد أنه قد لا يشتري أصلًا،
   فيبقى مالك محجوزًا بلا فائدة — ولهذا يُقاس معدّل التنفيذ لا الربح وحده.
   ============================================================ */
function limitReplay(bars, from, to, dip, target, fm, maxHold){
  let i = from, retSum = 0, tries = 0, fills = 0, hits = 0, holdBars = 0;
  const dds = [], waits = [];
  while(i < to - 2){
    const ref = bars[i].close;
    if(!(ref > 0)){ i++; continue; }
    const buyPx = ref * (1 - dip);

    let fillAt = -1;
    const fillEnd = Math.min(i + FILL_BARS, to - 1);
    for(let j=i+1; j<=fillEnd; j++){ if(bars[j].low <= buyPx){ fillAt = j; break; } }
    tries++;
    if(fillAt < 0){ holdBars += (fillEnd - i + 1); i = fillEnd + 1; continue; }  // لم يُنفَّذ — يُلغى

    fills++;
    const sell = buyPx * (1 + target) * fm;
    let worst = 0, hit = -1;
    const last = Math.min(fillAt + maxHold, to - 1);
    for(let j=fillAt; j<=last; j++){
      if(bars[j].low < buyPx) worst = Math.max(worst, (buyPx-bars[j].low)/buyPx*100);
      if(j > fillAt && bars[j].high >= sell){ hit = j; break; }
    }
    let exit, ret;
    if(hit >= 0){ exit = hit; ret = target*100; hits++; waits.push((exit-i+1)*4); }
    else { exit = last; ret = ((bars[last].close/buyPx)/fm - 1)*100; }

    retSum += ret; holdBars += (exit - i + 1); dds.push(worst);
    i = exit + 1;
  }
  const windowDays = (to-from)/BARS_PER_DAY;
  return {
    dip: dip*100, target: target*100,
    retPerDay: windowDays>0 ? retSum/windowDays : 0,
    tries, fills, hits,
    fillRate: tries ? Math.round(fills/tries*100) : 0,
    reach:    fills ? Math.round(hits/fills*100) : 0,
    medWaitH: pctOf(waits,0.5),
    ddP90: pctOf(dds,0.9) || 0,
    util: Math.round(holdBars/Math.max(1,(to-from))*100)
  };
}

function optimizeLimit(bars){
  const b = bars.filter(x => fin(x.high)&&fin(x.low)&&fin(x.close)&&x.low>0);
  const n = b.length;
  if(n < 800) return null;
  const split = Math.floor(n * TRAIN_FRAC);
  const fm = feeMult();

  let pick = null;
  for(const dip of LIMIT_DIPS){
    for(const T of LIMIT_TARGETS){
      const row = limitReplay(b, 0, split, dip, T, fm, HORIZON_BARS);
      if(row.fills < MIN_EFF_N*2) continue;
      if(row.fillRate < 40) continue;              // أمر لا يُنفَّذ نصف الوقت ليس استراتيجية
      if(!pick || row.retPerDay > pick.retPerDay) pick = row;
    }
  }
  if(!pick) return null;
  const test = limitReplay(b, split, n, pick.dip/100, pick.target/100, fm, HORIZON_BARS);
  return { train: pick, test,
           testDays: Math.round(((n-split)*4)/24),
           trainDays: Math.round((split*4)/24) };
}

function evaluateLimit(r){
  const o = r.limit;
  const none = {ok:false, retPerDay:null, main:[], detail:[], steps:[], stops:[], why:[], rec:null};
  if(!o) return {...none, cls:'bl-no', head:'⚪ ما بقدر أحكم — بياناتها قليلة'};
  const t = o.test;
  if(t.fills < MIN_EFF_N)   return {...none, cls:'bl-no', head:'⚪ ما بقدر أحكم — بياناتها قليلة'};
  if(t.fillRate < 40)       return {...none, cls:'bl-no', head:'🔴 لا تفتح جديد — الأمر ما بينفّذ غالبًا'};
  if(!fin(t.retPerDay) || t.retPerDay < MIN_RET_DAY)
                            return {...none, cls:'bl-no', head:'🔴 لا تفتح جديد — ربحها ما يستاهل'};
  if(t.ddP90 > MAX_DD)      return {...none, cls:'bl-no', head:'🔴 لا تفتح جديد — بتنزل كثير قبل ترجع'};

  const shrunk = t.retPerDay * (t.fills/(t.fills+SHRINK_K));
  if(shrunk < MIN_RET_DAY)  return {...none, cls:'bl-no', head:'🔴 لا تفتح جديد — ربحها ما يستاهل'};

  const base = r.livePrice ?? r.price;
  const buyPx  = base * (1 - t.dip/100);
  const sellPx = buyPx * (1 + t.target/100) * feeMult();

  return {
    ok:true, retPerDay: shrunk, dd: t.ddP90, durH: null,
    why: [],                       // كان ناقصًا — وهو سبب توقّف v31
    stops: [],
    cls: shrunk >= GOOD_RET_DAY ? 'bl-go' : 'bl-exp',
    head: '🟢 أمر محدّد',
    main: [
      ['اشتري عند', rndPx(r, buyPx),  'good'],
      ['بيع عند',   rndPx(r, sellPx), 'good'],
      ['الغِ الأمر بعد', 'يومين']
    ],
    detail: [
      ['💰 المتوقع', [
        ['ينفّذ الشراء', `${t.fillRate}%`],
        ['يوصل البيع بعدها', `${t.reach}%`],
        ['وسيط الانتظار', t.medWaitH!=null ? durTxt(t.medWaitH) : '—']
      ]],
      ['⚠️ المخاطر', [
        ['أسوأ تراجع', `−${t.ddP90.toFixed(1)}%`, cls3(-t.ddP90,-4,-MAX_DD)]
      ]]
    ],
    oos: `🔒 مقيس على ${o.testDays} يومًا لم يرها المحرّك`,
    rec: {type:'limit', sym:r.symbol, price:base, buy:buyPx, sell:sellPx, dip:t.dip, target:t.target}
  };
}

/* ==================== وحدة الشبكة (بملاءمة أمامية) ==================== */
function gridPercentile(sorted,p){
  const i=(sorted.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
  return lo===hi?sorted[lo]:sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);
}
function gridSimulate(cands, L, U, N, capital, ff){
  const spacing=(U-L)/N, perGrid=capital/N;
  const levels=[];
  for(let i=0;i<N;i++){ const b=L+i*spacing; levels.push({buy:b,sell:b+spacing,holding:false,coins:0}); }
  let realized=0, completed=0, inR=0, below=0;
  for(const c of cands){
    if(c.c<L) below++; else if(c.c<=U) inR++;
    for(const lv of levels){
      // v25: أُزيل اختصار "شراء وبيع داخل نفس الشمعة". الشمعة لا تخبرنا هل جاء
      // القاع قبل القمة، وv24 كانت تفترض الترتيب المربح دائمًا وتحتسب دورة كاملة.
      if(!lv.holding && c.l<=lv.buy){ lv.holding=true; lv.coins=perGrid/lv.buy; }
      else if(lv.holding && c.h>=lv.sell){ realized+=lv.coins*spacing-perGrid*ff; completed++; lv.holding=false; lv.coins=0; }
    }
  }
  const finalP=cands[cands.length-1].c;
  let openCost=0, openVal=0;
  for(const lv of levels) if(lv.holding){ openCost+=perGrid; openVal+=lv.coins*finalP; }
  const unreal=openVal-openCost, total=cands.length;
  return { L,U,N,spacing, realizedPct:realized/capital*100,
    netPct:(realized+unreal)/capital*100, unrealLossPct:Math.max(0,-unreal/capital*100),
    inRangePct:inR/total*100, belowPct:below/total*100, completed,
    gridNetPct:(spacing/L-ff)*100 };
}
function gridSafety(r){
  if(r.belowPct<8 && r.unrealLossPct<5)  return {t:'آمن',   c:'go'};
  if(r.belowPct<20 && r.unrealLossPct<12) return {t:'متوسط', c:'mid'};
  return {t:'مخاطرة', c:'risk'};
}
function optimizeGrid(h1K){
  if(!Array.isArray(h1K) || h1K.length < 600) return null;
  const cands = h1K.map(k=>({h:+k[2], l:+k[3], c:+k[4]})).filter(saneOHLC);
  if(cands.length < 600) return null;
  const split = Math.floor(cands.length * TRAIN_FRAC);
  const train = cands.slice(0,split), test = cands.slice(split);
  if(test.length < 120) return null;
  const ff = feeRound();
  const sorted = train.map(c=>c.c).slice().sort((a,b)=>a-b);
  const ranges=[[0.03,0.97],[0.07,0.93],[0.12,0.88],[0.18,0.82]];
  const grids=[20,30,45,70,100];
  let best=null;
  for(const [pl,pu] of ranges){
    const L=gridPercentile(sorted,pl), U=gridPercentile(sorted,pu);
    if(!(U>L)) continue;
    for(const N of grids){
      const r=gridSimulate(train,L,U,N,100,ff);
      if(r.gridNetPct<=0.05 || r.completed<15) continue;
      const s = r.netPct - 0.6*r.belowPct - 0.8*r.unrealLossPct;
      if(!best || s>best.s) best={L,U,N,s,train:r};
    }
  }
  if(!best) return null;
  const t = gridSimulate(test, best.L, best.U, best.N, 100, ff);
  const testDays = test.length/24;
  return {...t, safety:gridSafety(t), retPerDay:t.netPct/testDays, testDays:Math.round(testDays),
          trainDays:Math.round(train.length/24), trainNetPct:best.train.netPct};
}
function evaluateGrid(r){
  const g = r.grid;
  const none = {ok:false, retPerDay:null, main:[], detail:[], steps:[], stops:[], why:[], rec:null};
  if(!g) return {...none, cls:'bl-no', head:'⚪ ما بقدر أحكم على الشبكة',
    why:['تحتاج ~80 يومًا من شموع الساعة لتقسيمها لتدريب واختبار.']};
  if(g.gridNetPct <= 0.05) return {...none, cls:'bl-no', head:'🔴 لا شبكة — حركتها ضيقة والعمولة تأكل الربح',
    why:[`المسافة بين الخطوط ${(g.spacing/g.L*100).toFixed(2)}% مقابل رسوم ${(feeRound()*100).toFixed(3)}% — الهامش لا يكفي.`]};
  if(!fin(g.retPerDay) || g.retPerDay < MIN_RET_DAY || g.belowPct >= 25 || g.unrealLossPct > 15)
    return {...none, cls:'bl-no', head:'🔴 لا شبكة — بتخرج من النطاق كثير',
      why:[`خارج العينة: ${sgn(g.retPerDay)}/يوم (حدّك ${MIN_RET_DAY}%) · خرجت تحت النطاق ${g.belowPct.toFixed(0)}% من الوقت.`]};

  const sf = g.safety;
  // v24 كانت تعطي ok:true مع صندوق أحمر حين belowPct بين 20 و25 — كرت أحمر بعنوان أزرق مؤهّل للترتيب.
  if(sf.c === 'risk') return {...none, cls:'bl-no', head:'🔴 لا شبكة — خطرها عالي',
    why:[`خرجت تحت النطاق ${g.belowPct.toFixed(0)}% وخسارة معلّقة ${g.unrealLossPct.toFixed(1)}%.`]};

  const marginPct = g.gridNetPct;
  const feeIfNoBnb = ((g.spacing/g.L) - 0.002)*100;
  return {
    ok:true, retPerDay:g.retPerDay, rawRet:g.retPerDay, dd:g.unrealLossPct, durH:null,
    cls: sf.c==='go' && g.retPerDay>=GOOD_RET_DAY ? 'bl-go' : 'bl-exp',
    head: '🟢 شغّل شبكة',
    main: [
      ['من', rndPx(r, g.L), 'good'],
      ['إلى', rndPx(r, g.U), 'good'],
      ['عدد الشبكات', String(g.N)],
      ['النوع', 'حسابي'],
      ['أقل مبلغ', `${minGridUSD(r, g.N)}$`]
    ],
    detail: [
      ['💰 المتوقع', [
        ['وقت داخل النطاق', `${g.inRangePct.toFixed(0)}%`],
        ['صفقات منفّذة', `${g.completed} خلال ${g.testDays} يوم`]
      ]],
      ['⚠️ المخاطر', [
        ['خرجت تحت النطاق', `${g.belowPct.toFixed(0)}%`, cls3(-g.belowPct,-8,-20)],
        ['خسارة معلّقة', `${g.unrealLossPct.toFixed(1)}%`, cls3(-g.unrealLossPct,-5,-12)],
        ['هامش الخط الواحد', `${marginPct.toFixed(3)}%`, cls3(marginPct,0.15,0.06)]
      ]]
    ],
    why: [
      feeIfNoBnb <= 0.05
        ? `⚠️ لو وقف خصم BNB (رسوم 0.2%) هذه الشبكة تصير خاسرة. ابقِ رصيد BNB ممولًا.`
        : `تحمّل توقّف خصم BNB: الهامش يبقى ${feeIfNoBnb.toFixed(3)}% — تظل رابحة.`,
      `إذا نزل السعر تحت ${fmtPx(g.L)} أوقف الشبكة وفعّل «بيع الكل عند التوقّف».`,
      `النطاق مُختار من ${g.trainDays} يومًا سابقة، والأداء أعلاه من ${g.testDays} يومًا لم تدخل في الاختيار (على التدريب كان ${sgn(g.trainNetPct/(g.trainDays||1))}/يوم).`
    ],
    oos: `🔒 مقيس على ${g.testDays} يومًا لم يرها المحرّك`,
    rec:{ type:'grid', sym:r.symbol, price:(r.livePrice??r.price), L:g.L, U:g.U, N:g.N }
  };
}

/* v30: أُزيلت DCA من التوصيات (تحتاج نفسًا طويلًا ورأس مال كبير).
   بقيت المحاكاة وحدها ليبقى بالإمكان الحكم على توصيات DCA قديمة معلّقة. */
function dcaSimulate(cands, dropStep, tpGross, maxOrders, ff){
  let coins=0, cost=0, buys=0, lastBuy=null, realized=0, cycles=0, worstDD=0;
  const slice=1, cap=maxOrders*slice;
  for(const c of cands){
    // v25: الشراء الأول يقع عند إغلاق الشمعة، فلا يجوز فحص هدف البيع بقمة
    // نفس الشمعة — القمة قد تكون سبقت الإغلاق. v24 كانت تسمح بدورة كاملة داخل شمعة.
    const opened = (buys===0);
    if(opened){ coins+=slice/c.c; cost+=slice; buys=1; lastBuy=c.c; }
    else {
      while(buys<maxOrders && c.l <= lastBuy*(1-dropStep)){
        const px=lastBuy*(1-dropStep);
        coins+=slice/px; cost+=slice; buys++; lastBuy=px;
      }
    }
    const avg=cost/coins;
    worstDD=Math.max(worstDD,(avg-c.l)/avg*100);
    if(!opened && c.h >= avg*(1+tpGross)){ realized += cost*(tpGross-ff); cycles++; coins=0; cost=0; buys=0; lastBuy=null; }
  }
  const finalP=cands[cands.length-1].c;
  let unreal=0, stuck=false;
  if(buys>0){ const avg=cost/coins; unreal=coins*finalP-cost; stuck=(finalP < avg*0.97); }
  return { cycles, realizedPct:realized/cap*100, netPct:(realized+unreal)/cap*100,
    unrealLossPct:Math.max(0,-unreal/cap*100), worstDD, stuck };
}
/* ==================== المحرّك الموحّد ====================
   v24 كانت توجّه إجباريًا: عرضي→شبكة، صاعد→DCA، غيره→تواب — ثم ترتّب
   بمقاييس غير قابلة للمقارنة. v25 تحسب الثلاثة وتختار الأعلى عائدًا/يوم،
   والحالة صارت بوابة أمان لا موجّهًا. */
function evaluate(r, haltLevel){
  const blocked = (head, why) => ({ok:false, retPerDay:null, main:[], detail:[], steps:[], stops:[], why, cls:'bl-no', head, rec:null});

  if(haltLevel >= 1)
    return {...blocked('🟡 انتظر — السوق مش مناسب', ['لا دخول جديد حتى يهدأ السوق. أعد المسح لاحقًا.']), cls:'bl-wait'};

  if(r.pumpDump)
    return blocked('🔴 لا تدخل — نمط بمب ودمب بتاريخها', []);

  if(r.crashDay != null && r.crashDay <= CRASH_DAY_LIMIT)
    return blocked(`🔴 لا تدخل — نزلت ${Math.abs(r.crashDay).toFixed(0)}% بيوم واحد مؤخرًا`, []);

  if(r.maniaRatio != null && r.maniaRatio >= MANIA_RATIO)
    return blocked('🔴 لا تدخل — سعرها قفز بشكل غير طبيعي',
      [`تقلّب ${((r.maniaRatio-1)*100).toFixed(0)}% (أدنى→أعلى) خلال 30 يومًا — نمط Pump & Dump. تجاهلها حتى يهدأ.`]);

  if(RISKY_STATES.has(r.state)){
    const rg = r.regime, lbl = r.state==='TRENDING_DOWN' ? 'هابطة' : 'حركتها غير منظمة';
    if(!rg || rg.prob == null)
      return blocked(`🔴 لا تدخل — ${lbl} وما عندي بيانات كافية`,
        [`الحالات المشابهة (${rg?rg.sample:0}) أقل من ${REGIME_MIN_SAMPLE} — لا قياس موثوق للارتداد.`]);
    if(rg.prob < REGIME_MIN)
      return blocked(`🔴 لا تدخل — ${lbl} والأرجح تكمل نزول`,
        [`خرجت من هذه الحالة في اليوم التالي في ${rg.prob}% فقط من ${rg.sample} حالة — أقل من حدّك ${REGIME_MIN}%.`]);
  }

  // احسب الثلاثة، وخُذ الأعلى
  const opts = [];
  const twap = evaluateTwap(r);
  if(twap.ok) opts.push({...twap, kind:'تواب'});
  // الشبكة على عملة صاعدة/هابطة بقوة تكسر النطاق — البوابة تمنعها إحصائيًا، لكن نمنعها صراحة في الهبوط
  if(r.state !== 'TRENDING_DOWN'){
    const g = evaluateGrid(r); if(g.ok) opts.push({...g, kind:'شبكة'});
  }
  const lim = evaluateLimit(r); if(lim.ok) opts.push({...lim, kind:'أمر محدّد'});

  if(!opts.length) return twap;   // اعرض سبب رفض التواب كسبب رئيسي
  opts.sort((a,b)=> b.retPerDay - a.retPerDay);
  const win = opts[0];
  if(opts.length > 1){
    win.why = (win.why || []).concat([
      `فازت على: ${opts.slice(1).map(o=>`${o.kind} ${sgn(o.retPerDay)}/يوم`).join(' · ')}`
    ]);
  }
  return win;
}

/* ==================== شمعة يومية بحدّ ثابت ==================== */
function buildCustomDailyBars(h1K){
  const tzOffMin = new Date().getTimezoneOffset();
  const shiftMs  = (DAY_BOUNDARY_HOUR*60 + tzOffMin) * 60000;
  const DAY = 86400000, now = Date.now();
  const buckets = new Map();
  for(const k of h1K){
    const d = Math.floor((k[0] - shiftMs) / DAY);
    if(!buckets.has(d)) buckets.set(d, []);
    buckets.get(d).push(k);
  }
  let out = [];
  [...buckets.keys()].sort((a,b)=>a-b).forEach(d => {
    const arr = buckets.get(d);
    const startMs = d*DAY + shiftMs, endMs = startMs + DAY;
    if(now < endMs) return;
    if(arr.length < 24) return;
    out.push({
      openTime:startMs, closeTime:endMs,
      high: Math.max(...arr.map(x=>parseFloat(x[2]))),
      low:  Math.min(...arr.map(x=>parseFloat(x[3]))),
      close: parseFloat(arr[arr.length-1][4]),
      vol:  arr.reduce((a,x)=>a+parseFloat(x[5]),0)
    });
  });
  let cut = 0;
  for(let i=out.length-1;i>0;i--){
    if(out[i].openTime !== out[i-1].closeTime){ cut = i; break; }
  }
  return out.slice(cut);
}

async function fetchCandidates(count){
  const all = await fetchJSON(`${BASE}/ticker/24hr`);
  return all
    .filter(t => t.symbol.endsWith('USDT'))
    .filter(t => !/UP|DOWN|BULL|BEAR/.test(t.symbol))
    .filter(t => !STABLE_BASES.has(t.symbol.replace('USDT','')))
    .filter(t => parseFloat(t.quoteVolume) >= 5e6)   // سيولة دنيا صلبة: تحتها التنفيذ نفسه يصير مشكلة
    .sort((a,b)=> parseFloat(b.quoteVolume)-parseFloat(a.quoteVolume))
    .slice(0, count);
}

/* المرحلة 1: بيانات يومية فقط. رخيصة، وتُسقط أغلب العملات قبل أي تحليل ثقيل. */
async function screenSymbol(symbol){
  const dK = await fetchKlines(symbol,'1d',600);
  if(!Array.isArray(dK) || dK.length < MIN_BARS) return null;
  const bars = dK.slice(0,-1).map(k=>({high:+k[2], low:+k[3], close:+k[4], vol:+k[5], closeTime:k[6]}))
                 .filter(b => fin(b.close) && b.close>0 && fin(b.high) && fin(b.low));
  if(bars.length < MIN_BARS) return null;

  const dC=bars.map(b=>b.close), dH=bars.map(b=>b.high), dL=bars.map(b=>b.low), dV=bars.map(b=>b.vol);
  const e50=ema(dC,50), e200=ema(dC,200), adxD=adx(dH,dL,dC,14), stD=supertrend(dH,dL,dC,10,3);
  const c = classifyAtIndex(dC.length-1, dC, dH, dL, dV, e50, e200, adxD, stD.dir);
  if(!c) return null;

  // بوابات الخطر مبكرًا — لا داعي لتحليل عميق لعملة مرفوضة أصلًا
  if(RISKY_STATES.has(c.state)) return null;
  const dg = dangerFlags(dC);
  if(dg.pumpDump) return null;
  if(dg.crashDay != null && dg.crashDay <= CRASH_DAY_LIMIT) return null;
  const l30 = dC.slice(-30), mHigh=Math.max(...l30), mLow=Math.min(...l30);
  const maniaRatio = mLow>0 ? +(mHigh/mLow).toFixed(2) : null;
  if(maniaRatio != null && maniaRatio >= MANIA_RATIO) return null;

  // مقدار الحركة المتاحة — مصدر الربح. الخطر تكفّلت به البوابات أعلاه.
  const a10 = atr(dH,dL,dC,10).at(-1);
  const movePct = (fin(a10) && dC.at(-1)>0) ? (a10/dC.at(-1))*100 : 0;
  /* v31: قائمة أسماء العملات المستقرة لا تكفي — XUSD وغيرها تمرّ منها.
     الحركة نفسها هي المعيار: ما لا يتحرّك لا يُربح منه مهما كان اسمه. */
  if(movePct < MIN_MOVE_PCT) return null;

  const dayStates = computeDayStates(dC, dH, dL, dV, e50, e200, adxD, stD.dir, bars.map(x=>x.closeTime));
  return { symbol, bars, dC, dH, ...c, ...dg, maniaRatio, movePct,
           regime: regimePersistence(dayStates, c.state), price: dC.at(-1) };
}

/* المرحلة 2: تحليل كامل للناجين فقط */
async function deepAnalyze(sc){
  const [h4K, h1K] = await Promise.all([
    fetchKlines(sc.symbol,'4h',2000),
    fetchKlines(sc.symbol,'1h',2000)
  ]);
  if(!h4K.length || !h1K.length) return null;

  const lastBar = sc.bars[sc.bars.length-1];
  if(!LAST_BAR || lastBar.closeTime > LAST_BAR.closeTime) LAST_BAR = {closeTime:lastBar.closeTime};

  const r = {...sc};
  r.livePrice = parseFloat(h1K[h1K.length-1][4]);
  r.gapPct = r.price ? ((r.livePrice/r.price - 1)*100) : null;

  const b4 = h4K.map(k=>({ high:+k[2], low:+k[3], close:+k[4],
                           typ:(parseFloat(k[2])+parseFloat(k[3])+parseFloat(k[4]))/3 }));
  r.twap  = optimizeTwap(b4);
  r.limit = optimizeLimit(b4);
  r.grid  = optimizeGrid(h1K);
  return r;
}

/* ============ جسر السجل ============ */
function saveScannerRecs(evals){
  try{
    const map = {};
    evals.forEach(x=>{
      const rec = x.v && x.v.rec;
      if(!rec) return;
      const base = rec.sym.replace(/USDT$/,'').toUpperCase();
      let summary = '';
      if(rec.type==='grid')      summary = `شبكة ${fmtMoney(rec.L)} – ${fmtMoney(rec.U)} · ${rec.N} خط`;
      else if(rec.type==='twap') summary = `تواب ${durTxt(rec.durH)} · بيع عند +${rec.target}%`;
      else if(rec.type==='limit') summary = `أمر محدّد · شراء ${fmtMoney(rec.buy)} · بيع ${fmtMoney(rec.sell)}`;
      map[base] = { type:rec.type, price:rec.price, summary };
    });
    localStorage.setItem('scannerRecs_v1', JSON.stringify({ ts:Date.now(), map }));
  }catch(e){}
}

/* ==================== رسم الكروت ==================== */
/* v26: الكرت صار سطرين ونتيجة. كل ما بُني في v25 من قياس ومخاطر وتفسير
   انتقل خلف «التفاصيل» — موجود لمن يريده، غير معترض لمن يريد ينفّذ فقط. */
const rowsHTML = rows => rows.map(x=>`<div><span>${x[0]}</span><b class="${x[2]||''}">${x[1]}</b></div>`).join('');

function renderCard(r, v, rank=null){
  const main = (v.main&&v.main.length)
    ? `<div class="grp-rows main">${rowsHTML(v.main)}</div>` : '';

  const steps = '';   // v30: أُزيلت الخطوات — الأرقام وحدها

  const stops = (v.stops&&v.stops.length)
    ? `<div class="stops">${v.stops.map(x=>`<div>🛑 ${x}</div>`).join('')}</div>` : '';

  /* كل الأرقام التحليلية هنا — خلف نقرة، ما تعترض التنفيذ */
  const detailGroups = (v.detail||[]).map(([title, rows]) => `
    <div class="grp"><div class="grp-t">${title}</div><div class="grp-rows">${rowsHTML(rows)}</div></div>`).join('');
  const why = (v.why&&v.why.length)
    ? `<div class="why">${v.why.map(w=>`<div>• ${w}</div>`).join('')}</div>` : '';
  const oos = v.oos ? `<div class="oos">${v.oos}</div>` : '';
  const rate = v.retPerDay!=null ? `<div class="oos">العائد المقدّر: ${sgn(v.retPerDay)} لكل يوم يبقى فيه مالك بالصفقة</div>` : '';
  const hasDetail = detailGroups || why || oos || rate;
  const details = hasDetail
    ? `<details class="more"><summary>أرقام وتفاصيل (لو حبيت)</summary>${rate}${detailGroups}${why}${oos}</details>` : '';

  const rankH = rank!=null ? `<span class="rank">#${rank}</span>` : '';
  return `<div class="card">
    <div class="card-head">
      <span class="symbol">${rankH}${r.symbol.replace(/USDT$/,'')}</span>
    </div>
    <div class="bl ${v.cls}">
      <div class="bl-head">${v.head}</div>
      ${main}${steps}${stops}
    </div>
    ${details}
  </div>`;
}


/* ============================================================
   وحدة التحقق الذاتي (v28)
   ------------------------------------------------------------
   كل ما بُني قبل هذا نظري: قياس على تاريخ. هذه الوحدة هي الوحيدة
   التي تقول إن الأداة تعمل أو لا.
   المبدأ: تُسجَّل التوصية، وبعد 3 أيام تُعاد تنفيذها حرفيًا على
   الأسعار التي حدثت فعلًا — نفس النطاق، نفس المدة، نفس الهدف —
   ثم يُحسب الناتج. لا تقدير ولا استقراء: إعادة تشغيل على الواقع.
   ============================================================ */
const VERIFY_KEY  = 'scannerVerify_v3';
/* v29: مهلة الحكم بحسب طبيعة الاستراتيجية. التواب له مهلة فعلية (3 أيام)،
   أما الشبكة وDCA فبوتات تدور على مدى أسابيع — الحكم عليها بعد 3 أيام
   يظهرها أضعف من حقيقتها لأنها ببساطة لم تُكمل دورات كافية. */
const VERIFY_DAYS = { twap: 3, limit: 5, grid: 7, dca: 7 };
const waitMs  = t => (VERIFY_DAYS[t] || 3) * 86400000;
const waitHrs = t => (VERIFY_DAYS[t] || 3) * 24;
const VERIFY_MAX  = 300;

function vLoad(){ try{ const r=localStorage.getItem(VERIFY_KEY); return r?JSON.parse(r):[]; }catch(e){ return []; } }
function vSave(a){ try{ localStorage.setItem(VERIFY_KEY, JSON.stringify(a.slice(-VERIFY_MAX))); }catch(e){} }

/* مفتاح اليوم بنفس حدّ الساعة 18:00 — توصية واحدة لكل عملة في اليوم */
function vDayKey(ts){
  const d = new Date((ts ?? Date.now()) - DAY_BOUNDARY_HOUR*3600000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function recordPicks(top){
  if(!top.length) return;
  const log = vLoad();
  const day = vDayKey();
  let added = 0;
  for(const {r, v} of top){
    const rec = v && v.rec;
    if(!rec) continue;
    if(log.some(x => x.day===day && x.sym===rec.sym)) continue;   // مسجّلة اليوم
    log.push({
      day, ts: Date.now(), sym: rec.sym, type: rec.type,
      price0: rec.price ?? null,
      durH: rec.durH ?? null, target: rec.target ?? null,
      L: rec.L ?? null, U: rec.U ?? null, N: rec.N ?? null, tp: rec.tp ?? null, step: rec.step ?? null,
      status: 'pending', ret: null, note: null, days: null
    });
    added++;
  }
  if(added) vSave(log);
}

/* إعادة تنفيذ التوصية على ما حدث فعلًا */
async function verifyOne(rec){
  const url = `${BASE}/klines?symbol=${rec.sym}&interval=1h&startTime=${rec.ts}&limit=400`;
  const raw = await fetchJSON(url);
  if(!Array.isArray(raw) || raw.length < 60) return null;
  const c = raw.map(k=>({h:+k[2], l:+k[3], c:+k[4], t:(+k[2]+ +k[3]+ +k[4])/3})).filter(saneOHLC);
  const H = waitHrs(rec.type);                   // نافذة الحكم بحسب الاستراتيجية
  if(c.length < H*0.8) return null;
  const win = c.slice(0, Math.min(c.length, H));
  const fm = feeMult();

  if(rec.type === 'twap'){
    const D = Math.max(1, Math.min(rec.durH || 4, 48));
    if(c.length <= D) return null;
    let sum = 0; for(let i=0;i<D;i++) sum += c[i].t;
    const avg = sum/D;
    if(!(avg>0)) return null;
    const sell = avg * (1 + (rec.target||1)/100) * fm;
    for(let j=D; j<win.length; j++){
      if(win[j].h >= sell)
        return { ret: rec.target, days: +((j+1)/24).toFixed(1), note: 'وصلت الهدف وباعت' };
    }
    const last = win[win.length-1].c;
    return { ret: +(((last/avg)/fm - 1)*100).toFixed(2), days: +(win.length/24).toFixed(1),
             note: 'ما وصلت الهدف — محسوبة كبيع بالسوق' };
  }
  if(rec.type === 'grid'){
    if(!(rec.U > rec.L) || !rec.N) return null;
    const g = gridSimulate(win, rec.L, rec.U, rec.N, 100, feeRound());
    return { ret: +g.netPct.toFixed(2), days: +(win.length/24).toFixed(1),
             note: `${g.completed} صفقة · ${g.belowPct.toFixed(0)}% تحت النطاق` };
  }
  if(rec.type === 'limit'){
    let fillAt=-1;
    for(let j=0;j<Math.min(c.length,48);j++) if(c[j].l <= rec.buy){ fillAt=j; break; }
    if(fillAt < 0) return { ret: 0, days: 2, note: 'الأمر ما انفّذ — أُلغي بلا ربح ولا خسارة' };
    for(let j=fillAt+1;j<win.length;j++)
      if(win[j].h >= rec.sell)
        return { ret: +(((rec.sell/rec.buy)/fm - 1)*100).toFixed(2),
                 days: +((j+1)/24).toFixed(1), note: 'وصلت سعر البيع' };
    const last = win[win.length-1].c;
    return { ret: +(((last/rec.buy)/fm - 1)*100).toFixed(2), days: +(win.length/24).toFixed(1),
             note: 'ما وصلت سعر البيع بعد' };
  }
  if(rec.type === 'dca'){
    const d = dcaSimulate(win, (rec.step||1)/100, (rec.tp||1.15)/100, 8, feeRound());
    return { ret: +d.netPct.toFixed(2), days: +(win.length/24).toFixed(1),
             note: `${d.cycles} دورة بيع` };
  }
  return null;
}

async function verifyPending(setStatus){
  const log = vLoad();
  const due = log.filter(x => x.status==='pending' && (Date.now()-x.ts) >= waitMs(x.type));
  if(!due.length) return 0;
  let n = 0;
  for(const rec of due.slice(0, 12)){          // سقف لكل مسح حتى لا يطول
    if(setStatus) setStatus(`جارِ التحقق من توصية ${rec.sym.replace('USDT','')}...`);
    try{
      const out = await verifyOne(rec);
      if(out){ rec.status='done'; rec.ret=out.ret; rec.days=out.days; rec.note=out.note; n++; }
      else if(Date.now()-rec.ts > 20*86400000){ rec.status='skip'; rec.note='ما توفّرت بيانات'; }
    }catch(e){ /* نحاول بالمسح القادم */ }
    await new Promise(r=>setTimeout(r,120));
  }
  vSave(log);
  return n;
}

        : 'ما في توصيات مسجّلة بعد. كل مسح بيسجّل أفضل 3 تلقائيًا، وبعدين بيجيب السعر الحقيقي وبيحسب شو صار.'}</div>

      <span style="color:var(--buy)">${wins.length} ربحت</span> ·
      <span style="color:var(--sell)">${losses.length} خسرت</span></div>
    <div class="vsub">${[
        wins.length   ? `متوسط الربح <b style="color:var(--buy)">${sgn(avgW)}</b>` : '',
        losses.length ? `متوسط الخسارة <b style="color:var(--sell)">${sgn(avgL)}</b>` : ''
      ].filter(Boolean).join(' · ')}<br>
      الناتج الصافي لكل توصية <b style="color:${net>0?'var(--buy)':'var(--sell)'}">${sgn(net)}</b>
      ${pend ? ` · و<b>${nTawsia(pend)}</b> قيد المتابعة` : ''}</div>
    <details class="more"><summary>تفصيل</summary>
      ${byType.length ? `<div class="grp"><div class="grp-t">أي استراتيجية تنجح معك</div>
        <div class="grp-rows">${byType.map(x=>`<div><span>${x[0]}</span><b class="${x[2]}">${x[1]}</b></div>`).join('')}</div></div>` : ''}
      <div class="grp"><div class="grp-t">آخر النتائج</div>
        <div class="grp-rows">${recent.map(x=>`<div><span>${x[0]}</span><b class="${x[2]}">${x[1]}</b></div>`).join('')}</div></div>
      <div class="oos">محسوبة كأنك نفّذت كل توصية حرفيًا بنفس الإعدادات — التواب بعد 3 أيام، الشبكة وDCA بعد 7.
        لو ما فتحت الصفقة، بتضل مسجّلة — الرقم يقيس الأداة لا أداءك.</div>

/* ==================== الرسم الرئيسي ==================== */
function renderResults(results, haltLevel){
  const el = document.getElementById('results');
  if(!results.length){ el.innerHTML = '<div class="loading">ما في عملات مطابقة. نزّل «أقل سيولة».</div>'; return; }
  /* v32: عملة واحدة تُخرج استثناءً كانت تُسقط الشاشة بأكملها.
     الآن تُستبعد وحدها ويكمل الباقي. */
  const evals = [];
  for(const r of results){
    try{ evals.push({ r, v: evaluate(r, haltLevel) }); }
    catch(e){ console.warn('تخطّي', r && r.symbol, e && e.message); }
  }
  saveScannerRecs(evals);
  const eligible = evals.filter(x => x.v.ok).sort((a,b) => b.v.retPerDay - a.v.retPerDay);
  const top    = eligible.slice(0,3);
  const backup = eligible.slice(3,8);
  recordPicks(top);          // v28: يسجّل توصيات اليوم للتحقق لاحقًا

  let html = '';
  if(haltLevel >= 1){
    html += `<div class="sec-head">🎯 اشتغل على هذه</div>
      <div class="empty">ما في توصيات الآن — السوق مش مناسب. جرّب بعد شوي.</div>`;
  } else if(top.length){
    html += `<div class="sec-head">🎯 اشتغل على هذه</div>`;
    html += top.map((x,i) => renderCard(x.r, x.v, i+1)).join('');
    if(backup.length){
      html += `<div class="sec-head dim">بدائل لو ما ناسبتك اللي فوق</div>`;
      html += backup.map(x => renderCard(x.r, x.v)).join('');
    }
  } else {
    html += `<div class="sec-head">🎯 اشتغل على هذه</div>
      <div class="empty">ما في عملة تستاهل اليوم. لا تفتح شي، وجرّب بكرا.</div>`;
  }
  el.innerHTML = html;
}

/* ==================== المسح ==================== */
document.getElementById('scanBtn').addEventListener('click', runScan);

/* v31: عدّاد حيّ. المسح يأخذ ~دقيقتين على شبكة الجوال، وبلا مؤشر
   يبدو معلّقًا فيُغلق المستخدم الصفحة قبل أن ينتهي. */
let SCAN_T0 = 0, SCAN_TIMER = null;
const elapsed = () => {
  const sec = Math.round((Date.now()-SCAN_T0)/1000);
  return sec < 60 ? `${sec} ثانية` : `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} دقيقة`;
};
let SCAN_MSG = '';
function say(html){
  SCAN_MSG = html;
  document.getElementById('status').innerHTML =
    `${html} <span style="color:var(--gold)">· ${elapsed()}</span>`;
}

async function runScan(){
  const btn = document.getElementById('scanBtn');
  const statusEl = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = '⏳ جارِ المسح...';
  SCAN_T0 = Date.now();
  clearInterval(SCAN_TIMER);
  SCAN_TIMER = setInterval(()=>{ if(SCAN_MSG) say(SCAN_MSG); }, 1000);
  try{
  document.getElementById('results').innerHTML = '';
  LAST_BAR = null;
  say('جارِ فحص السوق...');

  const haltLevel = await checkBTCGuard();
  say('جارِ جلب العملات...');
  let pool;
  try{ pool = await fetchCandidates(PRESCREEN_N); }
  catch(e){ throw new Error('تعذّر جلب قائمة العملات'); }

  /* المرحلة 1 — فحص سريع ببيانات يومية: يُسقط الهابط والمهووس والخطر */
  const passed = [];
  for(let i=0;i<pool.length;i++){
    say(`الفحص السريع... ${i+1} من ${pool.length}`);
    try{
      const sc = await screenSymbol(pool[i].symbol);
      if(sc) passed.push({...sc, quoteVolume: parseFloat(pool[i].quoteVolume)});
    }catch(e){ /* تجاوز */ }
    if((i+1) % 6 === 0) await new Promise(r=>setTimeout(r,250));
  }
  /* الأكثر حركة أولًا — الحركة هي مصدر الربح، والفلاتر تكفّلت بالخطر */
  passed.sort((a,b)=> b.movePct - a.movePct);
  const deep = passed.slice(0, DEEP_N);

  await loadSpecs(deep.map(x=>x.symbol));

  /* المرحلة 2 — تحليل كامل */
  const results = [];
  for(let i=0;i<deep.length;i++){
    say(`تحليل معمّق... ${i+1} من ${deep.length} — <b>${deep[i].symbol.replace(/USDT$/,'')}</b>`);
    try{
      const r = await deepAnalyze(deep[i]);
      if(r) results.push(r);
    }catch(e){ /* تجاوز */ }
    if((i+1) % 4 === 0) await new Promise(r=>setTimeout(r,300));
  }

  renderDayBar();
  renderResults(results, haltLevel);

  say('جارِ التحقق من التوصيات السابقة...');
  const nDone = await verifyPending(t => say(t));
  renderVerify();
  SCAN_MSG = '';
  statusEl.innerHTML = haltLevel===1
    ? '<span style="color:var(--warn)">الفحص خلص — لكن السوق مش مناسب لفتح صفقة الآن</span>'
    : `✅ الفحص خلص بـ${elapsed()} — ${results.length} عملة عبرت الفلاتر من ${pool.length}` +
      (nDone ? ` · وتحقّقت من <b>${nTawsia(nDone)}</b> سابقة` : '');
  saveSnapshot();

  }catch(err){
    SCAN_MSG = '';
    statusEl.innerHTML = `<span style="color:var(--sell)">وقف المسح: ${err.message||'خطأ بالاتصال'} — اضغط الزر مرة ثانية</span>`;
  }finally{
    clearInterval(SCAN_TIMER);
    btn.disabled = false;                      // لا يبقى الزر معطّلًا مهما حصل
    btn.textContent = '🔍 امسح السوق';
  }
}

    .filter(x => /^[A-Z0-9]{2,15}$/.test(x))

/* ==================== حفظ/استرجاع آخر قراءة ==================== */
const SNAP_KEY = 'quietScanner_snapshot_v32';
function agoText(ms){
  const m = Math.round((Date.now()-ms)/60000);
  if(m < 1) return 'أقل من دقيقة';
  if(m < 60) return `${m} دقيقة`;
  const h = Math.floor(m/60), r = m%60;
  const hw = h===1?'ساعة':(h===2?'ساعتين':(h<11?`${h} ساعات`:`${h} ساعة`));
  return r ? `${hw} و${r} دقيقة` : hw;
}
function saveSnapshot(){
  try{
    localStorage.setItem(SNAP_KEY, JSON.stringify({
      ts: Date.now(),
      results: document.getElementById('results').innerHTML,
      verify:  document.getElementById('verifyWrap').innerHTML,
      watch:   document.getElementById('watchWrap').innerHTML,
      dayBar:  document.getElementById('dayBar').innerHTML,
      banner:  document.getElementById('btcBanner').innerHTML
    }));
  }catch(e){}
}
function bootFromSnapshot(){
  let snap = null;
  try{ const raw = localStorage.getItem(SNAP_KEY); if(raw) snap = JSON.parse(raw); }catch(e){}
  if(snap){
    document.getElementById('results').innerHTML   = snap.results || '';
    document.getElementById('verifyWrap').innerHTML = snap.verify || '';
    document.getElementById('watchWrap').innerHTML = snap.watch   || '';
    document.getElementById('dayBar').innerHTML    = snap.dayBar  || '';
    if(snap.banner) document.getElementById('btcBanner').innerHTML = snap.banner;
    document.getElementById('status').innerHTML =
      `📸 قراءات آخر فحص — قبل <b>${agoText(snap.ts)}</b>. اضغط <b>🔍 مسح السوق الآن</b> للتحديث.`;
  } else {
    document.getElementById('btcBanner').innerHTML = '';
    document.getElementById('results').innerHTML =
      '<div class="empty" style="padding:26px;text-align:center">اضغط <b>🔍 مسح السوق الآن</b>.<br><span style="font-size:11px">أول فحص بياخد دقيقة تقريبًا.</span></div>';
  }
}
bootFromSnapshot();
renderVerify();      // v28: الحصيلة تظهر فور الفتح، بلا انتظار مسح
</script>
